name: Build apps

# Builds Bluesky's `e2e`-profile development clients once and publishes them as
# assets of the `bench-apps` release, so the benchmark jobs download the same
# binaries and never build. Upstream's nightly builds the same profile with
# `pnpm eas build --profile e2e --local`, which needs an EXPO_TOKEN; this
# repo has no secrets, so it runs what that profile sets by hand:
# `expo prebuild` + Gradle / xcodebuild with the profile's env
# (eas.json: e2e extends development: developmentClient, EXPO_PUBLIC_ENV=e2e,
# NODE_ENV=development, RN_SRC_EXT=e2e.ts,e2e.tsx). The JS comes from Metro at
# test time, as upstream's nightly.
# - Android: bluesky-e2e.apk (debug dev client, x86_64 for the CI emulator)
# - iOS: Bluesky.app.zip (Debug dev client, arm64 simulator)
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated platforms to build
        default: 'android,ios'
      xcode:
        description: Xcode version (upstream's nightly uses 26.4)
        default: '26.4'

permissions:
  contents: write

env:
  CI: '1'
  EXPO_PUBLIC_ENV: e2e
  NODE_ENV: development
  RN_SRC_EXT: e2e.ts,e2e.tsx
  EXPO_NO_GIT_STATUS: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  android:
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EAS_BUILD_PLATFORM: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/bench/setup

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prebuild
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build the debug development client
        run: |
          cd android
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/bluesky-e2e.apk
          (cd dist && sha256sum bluesky-e2e.apk > bluesky-e2e.apk.sha256 && cat bluesky-e2e.apk.sha256)
          .github/bench/publish.sh dist/*

  ios:
    if: contains(inputs.platforms, 'ios')
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EAS_BUILD_PLATFORM: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode }}

      - name: Setup
        uses: ./.github/bench/setup

      - name: Prebuild
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install pods
        run: cd ios && LANG=en_US.UTF-8 pod install

      - name: Build the Debug simulator development client
        run: |
          cd ios
          xcodebuild -workspace Bluesky.xcworkspace -scheme Bluesky \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build > ../xcodebuild.log 2>&1 || {
              grep -nE 'error:|ld: |Undefined symbols|clang: error' ../xcodebuild.log | head -n 150
              tail -n 60 ../xcodebuild.log
              exit 1
            }
          tail -n 20 ../xcodebuild.log

      - name: Publish the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent ios/build/Build/Products/Debug-iphonesimulator/Bluesky.app dist/Bluesky.app.zip
          (cd dist && shasum -a 256 Bluesky.app.zip > Bluesky.app.zip.sha256 && cat Bluesky.app.zip.sha256)
          xcodebuild -version | tr '\n' ' ' > dist/Bluesky.app.xcode.txt
          .github/bench/publish.sh dist/*
