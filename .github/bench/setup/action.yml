name: Setup
description: >
  Node 24 + pnpm 11.28.5 (the repo's devEngines), the workspace install, the
  e2e env files (as upstream's nightly) and the compiled translations.
inputs:
  dev-env:
    description: Also install dev-env (the mock backend)
    default: 'false'
  agent-device-version:
    description: >
      Swap the hoisted agent-device copy for this version after the frozen install
      (empty = leave the locked 0.21.28, i.e. exactly the published arm). See
      .github/bench/ad-swap.sh for why this is a directory swap and not a lockfile
      override: the lockfile must stay byte-identical so agent-device is the ONLY
      changed variable versus the 0.21.28 rows.
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.28.5

    - uses: actions/setup-node@v4
      with:
        node-version: '24.19.0'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Opt-in engine bump (default off: an empty input leaves the locked 0.21.28 in place,
    # which is exactly what every published row ran). Runs after the frozen install and
    # before anything touches the engine, and it verifies that @e2e-dev/mobile still
    # loads and resolves the swapped copy. run-arm.sh records the resulting version in
    # tool_versions on every row, so a swapped run can never be mistaken for a locked one.
    - name: Pin agent-device to the requested version
      if: inputs.agent-device-version != ''
      shell: bash
      run: bash .github/bench/ad-swap.sh "$GITHUB_WORKSPACE" "${{ inputs.agent-device-version }}"

    - name: Install dev-env dependencies
      if: inputs.dev-env == 'true'
      shell: bash
      run: pnpm --dir dev-env install --frozen-lockfile

    # Upstream's nightly: Expo loads standard env filenames, so the E2E
    # overrides go in .env.development.
    - name: Prepare the E2E configuration
      shell: bash
      run: |
        cp .env.example .env
        cp .env.e2e .env.development
        cp google-services.json.example google-services.json

    - name: Compile translations
      shell: bash
      run: pnpm intl:build > i18n.log 2>&1 || (cat i18n.log; exit 1)
